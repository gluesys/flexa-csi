apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.flexa.com
spec:
  # ControllerPublishVolume/ControllerUnpublishVolume are not implemented, so no
  # attach step exists. Keeping this true only creates unused VolumeAttachment
  # objects and delays detach on node failure.
  attachRequired: false
  podInfoOnMount: true
  volumeLifecycleModes:
    - Persistent
