# Namespace for all namespaced resources (use helm --namespace / -n).
# Do not template Namespace in-chart: avoids conflicts with existing kubectl-created namespaces.
namespace: flexa-csi

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/gluesys/flexa-csi
  tag: "dev"
  pullPolicy: IfNotPresent

logLevel: info

# CSI sidecar images (registry.k8s.io/sig-storage)
sidecars:
  provisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v5.0.2
    pullPolicy: IfNotPresent
  resizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v1.11.2
    pullPolicy: IfNotPresent
  registrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.11.1
    pullPolicy: IfNotPresent
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.13.1
    pullPolicy: IfNotPresent
  snapshotter:
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    tag: v8.2.0
    pullPolicy: IfNotPresent

# VolumeSnapshot (ZFS only). Needs the snapshot CRDs and snapshot-controller in the
# cluster (kubernetes-csi/external-snapshotter, installed once per cluster).
snapshot:
  enabled: true
  timeout: 300s
  # VolumeSnapshotClass; created only when the snapshot CRDs are present.
  class:
    create: true
    name: flexa-snapclass-zfs
    deletionPolicy: Delete
    isDefault: false

# kubelet restarts csi-plugin when its gRPC Probe stops answering.
livenessProbe:
  failureThreshold: 5
  initialDelaySeconds: 10
  timeoutSeconds: 3
  periodSeconds: 10

controller:
  replicas: 1
  # 드라이버(csi-plugin)의 쿠버네티스 클라이언트 속도 제한. CreateVolume 마다 PVC 를 한 번 조회한다.
  kubeApiQps: 50
  kubeApiBurst: 100
  # 프록시 호출 한 번의 상한. 기존 REST 프록시는 부하가 걸리면 몇 분씩 걸린다.
  # 호출이 끝날 때까지 그 볼륨은 잠겨 있고, 재시도는 ABORTED 로 돌아간다.
  proxyTimeout: 5m
  # controller 와 node 가 같은 노드에서 hostNetwork 로 뜨므로 포트를 나눈다.
  healthPort: 9808
  # external-provisioner 의 동시 처리 수와 쿠버네티스 클라이언트 속도 제한
  provisioner:
    timeout: 60s
    workerThreads: 100
    kubeApiQps: 50
    kubeApiBurst: 100
  resizer:
    timeout: 60s
  hostNetwork: true
  labels: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

node:
  hostNetwork: true
  hostPID: true
  labels: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  healthPort: 9809
  kubeletPath: /var/lib/kubelet
  pluginDir: /var/lib/kubelet/plugins/csi.flexa.com/
  registrationDir: /var/lib/kubelet/plugins_registry
  flexaMetaPath: /var/lib/flexa/meta
  flexaGroupMountPath: /mnt/flexa
  # FlexA 는 NFS v3 만 켜 둔다. v3 파일 잠금(NLM)에 필요한 rpcbind·rpc.statd 를 node 플러그인이
  # 띄우고 지켜본다(노드에 이미 떠 있으면 그대로 쓴다).
  nfsLockDaemons: true
  statdStatePath: /var/lib/flexa/statd
  # 노드에서 동시에 진행하는 Lustre 마운트 수. 여러 개를 함께 마운트하면 Lustre 클라이언트가
  # 설정 로그를 읽다 EIO 로 실패하는 경우가 있어 제한한다(EIO 는 플러그인이 다시 시도한다).
  lustreMountConcurrency: 2

# client-info Secret mounted at /etc/flexa/client-info.yml
clientInfo:
  # Kubernetes Secret name (used by controller and node volumes)
  secretName: client-info-secret
  # If true, chart creates the Secret from `content` (development / single-step install).
  # If false, create the Secret yourself before install: kubectl create secret generic ...
  create: true
  # provisiond client token, sent as "Authorization: Bearer <token>" on every request.
  # Issue it on the storage (MGMT_VIP controller):
  #   cd /anystor/provision && python3.12 -m provisiond.ctl client-token create --name csi-<cluster>
  # Written as the top-level `token` of client-info.yml; profiles without their own
  # `token` use it. Prefer --set clientInfo.token=... over committing it to a values file.
  # Use either this or a top-level `token:` in content, not both. Per-profile tokens go in content.
  # Rotation without 401s: create csi-<cluster>-2, update the Secret, then delete the old name.
  token: ""
  content: |
    profiles:
      zfs:
        fs: zfs
        proxyIP: 10.0.0.11
        proxyPort: 9001
        mountIP: "172.16.0.0/18"
      lustre:
        fs: lustre
        proxyIP: 10.0.0.12
        proxyPort: 9001
        mountIP: "172.16.0.0/18"

# Optional StorageClasses: arbitrary keys (e.g. zfs_poolA). Set enabled: true per entry.
# ZFS: set poolName. Lustre: set clusterName (not poolName). Align proxyProfile with clientInfo profiles.
# volumeNameFormat (optional): backend volume/share name. Default "{pvname}" (pvc-<uid>).
#   Placeholders {pvname} (required), {namespace}, {pvcname}. Use "_" as separator: "{namespace}_{pvname}".
#   Lustre allows [A-Za-z0-9._-], ZFS allows [A-Za-z0-9_-] and must start with a letter; max 128.
#   StorageClass parameters are immutable: changing it needs the StorageClass recreated.
storageClass:
  zfs_poolA:
    enabled: false
    name: flexa-sc-zfs-a
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    proxyProfile: zfs
    poolName: k8sA
    protocol: nfs
    # Defaults for PVCs of this class. A PVC annotation with the same name
    # (flexa.io/<key>) overrides the value. Keys: optionISS, optionSVS,
    # optionComp, optionDedup, secureAddress, secureSubnet, nfsAccess,
    # nfsNoRootSquashing, nfsInsecure, pvcQos.
    volumeDefaults: {}
    #   optionISS: "on"
    #   optionComp: "off"
  zfs_poolB:
    enabled: false
    name: flexa-sc-zfs-b
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    proxyProfile: zfs
    poolName: k8sB
    protocol: nfs
  lustre:
    enabled: true
    name: flexa-sc-lustre
    reclaimPolicy: Delete
    allowVolumeExpansion: true
    proxyProfile: lustre
    clusterName: k8s_cvol
    protocol: lustre

# Lustre QoS MutatingAdmissionWebhook
# TLS: If certManager is false and certSecret is empty, the chart auto-creates a self-signed
# Secret (<release>-webhook-certs) and sets caBundle on the MutatingWebhookConfiguration.
# To use your own certs, set certSecret to the Secret name and provide caBundle (PEM base64).
webhook:
  enabled: true
  replicas: 1
  port: 8443
  failurePolicy: Ignore
  image:
    repository: ghcr.io/gluesys/flexa-csi
    tag: "dev"
    pullPolicy: IfNotPresent
  certSecret: ""
  certManager: false
  caBundle: ""
  resources: {}
