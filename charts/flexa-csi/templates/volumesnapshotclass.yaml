{{- if and .Values.snapshot.enabled .Values.snapshot.class.create (.Capabilities.APIVersions.Has "snapshot.storage.k8s.io/v1") }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.snapshot.class.name }}
  labels:
    {{- include "flexa-csi.labels" . | nindent 4 }}
  {{- if .Values.snapshot.class.isDefault }}
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
  {{- end }}
driver: csi.flexa.com
deletionPolicy: {{ .Values.snapshot.class.deletionPolicy }}
{{- end }}
