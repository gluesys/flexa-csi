{{- if .Values.clientInfo.create }}
{{- if and .Values.clientInfo.token (regexMatch "(?m)^token:" .Values.clientInfo.content) }}
{{- fail "set the token in clientInfo.token or as top-level token in clientInfo.content, not both" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clientInfo.secretName }}
  namespace: {{ include "flexa-csi.namespace" . }}
  labels:
    {{- include "flexa-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-info.yml: |
    {{- with .Values.clientInfo.token }}
    token: {{ . | quote }}
    {{- end }}
    {{- .Values.clientInfo.content | nindent 4 }}
{{- end }}
