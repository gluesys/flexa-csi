apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flexa-csi.fullname" . }}-controller
  namespace: {{ include "flexa-csi.namespace" . }}
  labels:
    {{- include "flexa-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  serviceName: {{ include "flexa-csi.fullname" . }}-controller
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "flexa-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "flexa-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flexa-csi.fullname" . }}-controller-sa
      hostNetwork: {{ .Values.controller.hostNetwork }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controller.affinity }}
      affinity:
        {{- toYaml .Values.controller.affinity | nindent 8 }}
      {{- else if and .Values.controller.hostNetwork (gt (int .Values.controller.replicas) 1) }}
      # hostNetwork replicas on one node would share the health port.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "flexa-csi.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: controller
      {{- end }}
      containers:
        - name: csi-provisioner
          # Only to reach the plugin's socket on SELinux-enforcing nodes, where an
          # unprivileged container cannot connect to a socket a privileged one made.
          securityContext:
            privileged: true
          image: "{{ .Values.sidecars.provisioner.repository }}:{{ .Values.sidecars.provisioner.tag }}"
          args:
            - --timeout={{ .Values.controller.provisioner.timeout }}
            - --csi-address=$(ADDRESS)
            - --v=5
            - --extra-create-metadata
            - --leader-election
            - --worker-threads={{ .Values.controller.provisioner.workerThreads }}
            - --kube-api-qps={{ .Values.controller.provisioner.kubeApiQps }}
            - --kube-api-burst={{ .Values.controller.provisioner.kubeApiBurst }}
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: {{ .Values.sidecars.provisioner.pullPolicy }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-resizer
          # Only to reach the plugin's socket on SELinux-enforcing nodes, where an
          # unprivileged container cannot connect to a socket a privileged one made.
          securityContext:
            privileged: true
          image: "{{ .Values.sidecars.resizer.repository }}:{{ .Values.sidecars.resizer.tag }}"
          args:
            - --v=5
            - --csi-address=$(ADDRESS)
            - --timeout={{ .Values.controller.resizer.timeout }}
            - --leader-election
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: {{ .Values.sidecars.resizer.pullPolicy }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-plugin
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args:
            - --nodeid=NotUsed
            - --endpoint=$(CSI_ENDPOINT)
            - --client-info
            - /etc/flexa/client-info.yml
            - --log-level={{ .Values.logLevel }}
            - --kube-api-qps={{ .Values.controller.kubeApiQps }}
            - --kube-api-burst={{ .Values.controller.kubeApiBurst }}
            - --proxy-timeout={{ .Values.controller.proxyTimeout }}
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: healthz
              containerPort: {{ .Values.controller.healthPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
            httpGet:
              path: /healthz
              port: healthz
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            - name: client-info
              mountPath: /etc/flexa
              readOnly: true
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: liveness-probe
          # Only to reach the plugin's socket on SELinux-enforcing nodes, where an
          # unprivileged container cannot connect to a socket a privileged one made.
          securityContext:
            privileged: true
          image: "{{ .Values.sidecars.livenessProbe.repository }}:{{ .Values.sidecars.livenessProbe.tag }}"
          imagePullPolicy: {{ .Values.sidecars.livenessProbe.pullPolicy }}
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
            - --http-endpoint=:{{ .Values.controller.healthPort }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: client-info
          secret:
            secretName: {{ .Values.clientInfo.secretName }}
